[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsfm-fairness-audit"
version = "0.1.0"
description = "Fairness auditing framework for Remote Sensing Foundation Models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
unet = ["torch>=2.0"]

[project.scripts]
rsfm-audit = "rsfm_fairness_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
