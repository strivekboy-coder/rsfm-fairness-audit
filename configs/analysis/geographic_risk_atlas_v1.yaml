schema: geobwer.geographic_risk_atlas.protocol.v1
execution: {cpu_only: true, training: false, external_bulk_downloads: false}
tasks:
  alphaearth:
    representation: observed_coordinate_or_spatial_block_centroid
    preferred_unit: spatial_block_id
    canonical_source: formal_outputs/formal_audit_table.csv
    rejected_as_coordinate_sources: [geobwer_raw/geobwer_by_group.csv, geobwer_raw/geobwer_profile.csv, geobwer_raw/geobwer_summary.csv]
    risk_role: descriptive_reference_map_agreement
  fmow:
    representation: observed_coordinate_site_or_location_unit
    preferred_unit: location_id
    risk_role: descriptive_scene_classification_error
    model_seed_policy:
      DOFAv2: {expected_seed_count: 1, role: existing_single_run_localization}
      ResNet50:
        discovery: manifest_validated_direct_seed_children
        observed_canonical_seeds_2026_08_16: [42, 73, 101]
        aggregation: within_seed_unit_risk_then_equal_seed_mean
        single_seed_fallback_role: single_seed_descriptive
    common_unit_contract: exact_unit_universe_support_and_coordinates_across_seeds
  reben:
    representation: country_x_label_burden_matrix
    risk_role: paired_s1_ood_minus_s2_id_risk_binary_error
    forbidden_risk_substitution: risk_bce
    forbid: [invented_coordinates, country_centroid_as_sample_location]
    cross_model_country_comparison:
      models: [TerraMind, CROMA]
      source: paired_shift_country_deltas.csv
      estimand: S1_OOD_minus_S2_ID_mean_labelwise_binary_error
      seed_aggregation: equal_seed_mean_with_seed_sd
      support_contract: identical_country_seed_universe_and_support
visual_contract:
  mean_risk: viridis
  tail_burden: magma
  signed_delta: PuOr_r_centered_zero
  output: [png_300dpi, pdf]
  layout: constrained_layout
  automated_qa: [file_size, pixel_dimensions, nonwhite_content]
  figure_system:
    filename_prefix: atlas_
    typography: DejaVu_Sans_8pt_base
    panel_labels: uppercase_bold
    categorical_palette: Okabe_Ito
    signed_delta: PuOr_r_centered_zero
anti_p_hacking:
  primary_views: [mean_risk, tail_excess, paired_delta]
  tail_definition: unit_risk_q90_excess_exploratory
  subgroup_search: fixed_existing_axes_only
  inference: descriptive_unless_separately_preregistered_and_multiplicity_adjusted
